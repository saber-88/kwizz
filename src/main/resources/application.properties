# Server
server.port=8080

# H2 in-memory database (swap to MySQL/Postgres later just by changing these lines)
spring.datasource.url=jdbc:h2:mem:quizdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 web console - visit http://localhost:8080/h2-console while app is running
# JDBC URL to paste in: jdbc:h2:mem:quizdb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf - disable caching during development so template edits show up
# without restarting the app
spring.thymeleaf.cache=false
