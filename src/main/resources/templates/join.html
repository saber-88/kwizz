<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Join a quiz · Kwizz')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar('public', 'join')}"></header>

<main class="container narrow auth-wrap">
    <div class="card auth-card">
        <h1>Join a quiz</h1>
        <p class="card-sub">Enter the code on the host's screen and pick a nickname.</p>

        <div class="alert alert-error" role="alert" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/join}" method="post">
            <div class="field">
                <label for="code">Join code</label>
                <input class="code-input" type="text" id="code" name="code" th:value="${prefilledCode}"
                       autocomplete="off" required>
            </div>

            <div class="field">
                <label for="nickname">Nickname</label>
                <input type="text" id="nickname" name="nickname" autocomplete="nickname" required>
            </div>

            <button type="submit" class="btn btn-block btn-lg">Join</button>
        </form>
    </div>
</main>
</body>
</html>
