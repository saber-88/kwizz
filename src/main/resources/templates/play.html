<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Playing</title>
</head>
<body>

<h1>
    Hi, <span th:text="${participant.nickname}"></span>
</h1>

<div id="waiting"
     th:style="${quizSession.status != null and quizSession.status.name() == 'WAITING'}
        ? ''
        : 'display:none'">
    <p>Waiting for the host to start…</p>
    <h3>Players joined: <span id="participant-count" th:text="${quizSession.participants.size()}"></span></h3>
    <ul id="participant-list">
        <li th:each="p : ${quizSession.participants}" th:text="${p.nickname}"></li>
    </ul>
</div>

<div id="finished"
     th:style="${quizSession.status != null and quizSession.status.name() == 'FINISHED'}
        ? ''
        : 'display:none'">
    <h2>Quiz finished — thanks for playing!</h2>
</div>

<div id="question-box"
     th:style="${quizSession.status != null and quizSession.status.name() == 'IN_PROGRESS'}
        ? ''
        : 'display:none'">

    <p id="question-progress"></p>
    <h2 id="question-text"></h2>

    <button class="option-btn" data-option="0" id="optA"></button>
    <button class="option-btn" data-option="1" id="optB"></button>
    <button class="option-btn" data-option="2" id="optC"></button>
    <button class="option-btn" data-option="3" id="optD"></button>
</div>

<p id="answer-feedback"></p>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<script th:inline="javascript">

    const sessionId = /*[[${quizSession.id}]]*/ 0;
    const participantToken = /*[[${participant.sessionToken}]]*/ '';

    console.log("🔥 PLAYER SCRIPT STARTED");

    console.log("🔥 SESSION ID =", sessionId);

    const socket = new SockJS('/ws');

    console.log("🔥 SOCKJS CREATED");

    const stompClient = new StompJs.Client({
        webSocketFactory: () => socket,

        onConnect: () => {


            stompClient.subscribe(
                '/topic/session/' + sessionId + '/question',
                (message) => {
                    const data = JSON.parse(message.body);
                    if (data.finished) {
                        showFinished();
                    } else {
                        renderQuestion(data);
                    }
                }
            );

            stompClient.subscribe(
                '/topic/session/' + sessionId + '/participants',
                (message) => {
                    const nicknames = JSON.parse(message.body);
                    const countEl = document.getElementById('participant-count');
                    const listEl = document.getElementById('participant-list');
                    if (!countEl || !listEl) return;

                    countEl.textContent = nicknames.length;
                    listEl.innerHTML = '';
                    nicknames.forEach(name => {
                        const li = document.createElement('li');
                        li.textContent = name;
                        listEl.appendChild(li);
                    });
                }
            );
        }
    });

    stompClient.activate();

    function renderQuestion(data) {
        document.getElementById('waiting').style.display = 'none';
        document.getElementById('finished').style.display = 'none';
        document.getElementById('question-box').style.display = '';

        document.getElementById('question-progress').textContent =
            'Question ' + data.questionNumber + ' of ' + data.totalQuestions;
        document.getElementById('question-text').textContent = data.text;

        setOption('optA', 'A', data.optionA, data.questionId);
        setOption('optB', 'B', data.optionB, data.questionId);
        setOption('optC', 'C', data.optionC, data.questionId);
        setOption('optD', 'D', data.optionD, data.questionId);

        document.getElementById('answer-feedback').textContent = '';
    }

    function setOption(id, letter, text, questionId) {
        const el = document.getElementById(id);
        el.textContent = letter + '. ' + text;
        el.dataset.questionId = questionId;
    }

    function showFinished() {
        document.getElementById('waiting').style.display = 'none';
        document.getElementById('question-box').style.display = 'none';
        document.getElementById('finished').style.display = '';
    }

    document.querySelectorAll('.option-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const questionId = btn.dataset.questionId;
            const option = btn.dataset.option;

            document.getElementById('answer-feedback').textContent =
                'Answer submitted (scoring not built yet).';

            console.log('Question:', questionId, 'Option:', option);
        });
    });

</script>

</body>
</html>
