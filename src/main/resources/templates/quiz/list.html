<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>My quizzes</title>
<script th:src="@{/js/theme.js}" defer></script>
</head>
<body class="page-quiz-list">
<h1>My quizzes</h1>
<a class="btn" th:href="@{/quizzes/new}">+ New quiz</a>

<p class="empty" th:if="${#lists.isEmpty(quizzes)}">
    No quizzes yet - create your first one above.
</p>

<table th:if="${!#lists.isEmpty(quizzes)}">
    <thead>
    <tr>
        <th>Title</th>
        <th>Description</th>
        <th>Questions</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="quiz : ${quizzes}">
        <td th:text="${quiz.title}"></td>
        <td th:text="${quiz.description}"></td>
        <td th:text="${quiz.questions.size()}"></td>
        <td><a th:href="@{/quizzes/{id}(id=${quiz.id})}">Open</a></td>
    </tr>
    </tbody>
</table>
</body>
</html>
