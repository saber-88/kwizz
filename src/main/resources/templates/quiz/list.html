<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My quizzes · Kwizz')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar('host', 'quizzes')}"></header>

<main class="container">
    <div class="page-head">
        <div>
            <h1>My quizzes</h1>
            <p>Pick a quiz to edit its questions or start a live session.</p>
        </div>
        <a class="btn" th:href="@{/quizzes/new}">New quiz</a>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(quizzes)}">
        <h3>No quizzes yet</h3>
        <p>Create your first quiz to start hosting.</p>
        <a class="btn" th:href="@{/quizzes/new}">Create a quiz</a>
    </div>

    <div class="quiz-grid" th:if="${!#lists.isEmpty(quizzes)}">
        <a class="card quiz-card" th:each="quiz : ${quizzes}" th:href="@{/quizzes/{id}(id=${quiz.id})}">
            <h3 th:text="${quiz.title}">Quiz title</h3>
            <p th:text="${#strings.isEmpty(quiz.description) ? 'No description' : quiz.description}">Description</p>
            <div class="meta">
                <span class="pill"
                      th:text="${quiz.questions.size() == 1 ? '1 question' : quiz.questions.size() + ' questions'}">0 questions</span>
                <span class="open">Open</span>
            </div>
        </a>
    </div>
</main>
</body>
</html>
