<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Playing · Kwizz')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar('player', '')}"></header>

<main class="container mid">

    <h1 class="player-title"><span class="muted">Playing as</span> <span th:text="${participant.nickname}"></span></h1>

    <div id="waiting" class="card phase"
         th:style="${quizSession.status != null and quizSession.status.name() == 'WAITING'}
            ? ''
            : 'display:none'">
        <p class="waiting-line">Waiting for the host to start…</p>
        <h3 style="margin-top:20px">Players joined: <span class="count" id="participant-count"
                                                         th:text="${quizSession.participants.size()}"></span></h3>
        <ul class="chips" id="participant-list">
            <li th:each="p : ${quizSession.participants}" th:text="${p.nickname}"></li>
        </ul>
    </div>

    <div id="finished" class="card phase"
         th:style="${quizSession.status != null and quizSession.status.name() == 'FINISHED'}
            ? ''
            : 'display:none'">
        <h2>Quiz finished</h2>
        <p class="muted" style="margin-top:6px">Thanks for playing!</p>
        <div class="actions"><a class="btn" th:href="@{/}">Back to home</a></div>
    </div>

    <div id="question-box" class="card phase"
         th:style="${quizSession.status != null and quizSession.status.name() == 'IN_PROGRESS'}
            ? ''
            : 'display:none'">

        <div class="round-meta">
            <p class="progress" id="question-progress"></p>
            <div class="timer" aria-label="Time left"><span id="timer"></span><small>s</small></div>
        </div>

        <h2 class="question-text" id="question-text"></h2>

        <div class="tiles">
            <button type="button" class="tile tile-a option-btn" data-option="0" id="optA"></button>
            <button type="button" class="tile tile-b option-btn" data-option="1" id="optB"></button>
            <button type="button" class="tile tile-c option-btn" data-option="2" id="optC"></button>
            <button type="button" class="tile tile-d option-btn" data-option="3" id="optD"></button>
        </div>
    </div>

    <div id="leaderboard-section" class="card phase" style="display:none">
        <h2>Leaderboard</h2>
        <ol class="leaderboard" id="leaderboard-list"></ol>
        <p class="muted" style="margin-top:16px">Waiting for the host to continue…</p>
    </div>

    <div id="between-rounds" class="card phase" style="display:none">
        <p class="waiting-line">Waiting for the host to continue…</p>
    </div>

    <p id="answer-feedback" role="status" aria-live="polite"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<script th:inline="javascript">

    const sessionId = /*[[${quizSession.id}]]*/ 0;
    const participantToken = /*[[${participant.sessionToken}]]*/ '';
    const myNickname = /*[[${participant.nickname}]]*/ '';
    let questionStartTime = 0;
    let countdownInterval = null;

    /*[# th:if="${quizSession.status.name() == 'IN_PROGRESS' and !showingLeaderboard}"]*/
    renderQuestion({
        questionId: /*[[${quizSession.quiz.questions[quizSession.currentQuestionIndex].id}]]*/ 0,
        text: /*[[${quizSession.quiz.questions[quizSession.currentQuestionIndex].text}]]*/ '',
        optionA: /*[[${quizSession.quiz.questions[quizSession.currentQuestionIndex].optionA}]]*/ '',
        optionB: /*[[${quizSession.quiz.questions[quizSession.currentQuestionIndex].optionB}]]*/ '',
        optionC: /*[[${quizSession.quiz.questions[quizSession.currentQuestionIndex].optionC}]]*/ '',
        optionD: /*[[${quizSession.quiz.questions[quizSession.currentQuestionIndex].optionD}]]*/ '',
        timeLimitSeconds: /*[[${quizSession.quiz.questions[quizSession.currentQuestionIndex].timeLimitSeconds}]]*/ 20,
        questionNumber: /*[[${quizSession.currentQuestionIndex + 1}]]*/ 1,
        totalQuestions: /*[[${quizSession.quiz.questions.size()}]]*/ 1
    });
    /*[/]*/

    /*[# th:if="${quizSession.status.name() == 'IN_PROGRESS' and showingLeaderboard}"]*/
    renderLeaderboard({ entries: /*[[${leaderboard}]]*/ [] });
    /*[/]*/

    const socket = new SockJS('/ws');
    const stompClient = new StompJs.Client({
        webSocketFactory: () => socket,
        onConnect: () => {

            stompClient.subscribe('/topic/session/' + sessionId + '/question', (message) => {
                const data = JSON.parse(message.body);
                if (data.finished) {
                    showFinished();
                } else {
                    renderQuestion(data);
                }
            });

            stompClient.subscribe('/topic/session/' + sessionId + '/leaderboard', (message) => {
                renderLeaderboard(JSON.parse(message.body));
            });

            stompClient.subscribe('/topic/session/' + sessionId + '/participants', (message) => {
                const nicknames = JSON.parse(message.body);
                const countEl = document.getElementById('participant-count');
                const listEl = document.getElementById('participant-list');
                if (!countEl || !listEl) return;
                countEl.textContent = nicknames.length;
                listEl.innerHTML = '';
                nicknames.forEach(name => {
                    const li = document.createElement('li');
                    li.textContent = name;
                    listEl.appendChild(li);
                });
            });
        }
    });
    stompClient.activate();

    function hideAllPhases() {
        document.getElementById('waiting').style.display = 'none';
        document.getElementById('finished').style.display = 'none';
        document.getElementById('question-box').style.display = 'none';
        document.getElementById('leaderboard-section').style.display = 'none';
    }

    function renderQuestion(data) {
        hideAllPhases();
        document.getElementById('question-box').style.display = '';

        document.getElementById('question-progress').textContent =
            'Question ' + data.questionNumber + ' of ' + data.totalQuestions;
        document.getElementById('question-text').textContent = data.text;

        setOption('optA', 'A', data.optionA, data.questionId);
        setOption('optB', 'B', data.optionB, data.questionId);
        setOption('optC', 'C', data.optionC, data.questionId);
        setOption('optD', 'D', data.optionD, data.questionId);

        document.getElementById('answer-feedback').textContent = '';
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.disabled = false;
            btn.classList.remove('selected');
        });

        questionStartTime = Date.now();
        startCountdown(data.timeLimitSeconds);
    }

    function setOption(id, letter, text, questionId) {
        const el = document.getElementById(id);
        el.textContent = '';
        const key = document.createElement('span');
        key.className = 'key';
        key.textContent = letter;
        const label = document.createElement('span');
        label.textContent = text;
        el.append(key, label);
        el.dataset.questionId = questionId;
    }

    function showFinished() {
        hideAllPhases();
        clearInterval(countdownInterval);
        document.getElementById('answer-feedback').textContent = '';
        document.getElementById('finished').style.display = '';
    }

    function renderLeaderboard(data) {
        hideAllPhases();
        clearInterval(countdownInterval);
        document.getElementById('answer-feedback').textContent = '';
        document.getElementById('leaderboard-section').style.display = '';

        const listEl = document.getElementById('leaderboard-list');
        listEl.innerHTML = '';
        data.entries.forEach(entry => {
            const li = document.createElement('li');
            if (entry.nickname === myNickname) li.classList.add('me');
            const name = document.createElement('span');
            name.className = 'lb-name';
            name.textContent = entry.nickname;
            const score = document.createElement('span');
            score.className = 'lb-score';
            score.textContent = entry.score;
            li.append(name, score);
            listEl.appendChild(li);
        });
    }

    function startCountdown(seconds) {
        clearInterval(countdownInterval);
        let remaining = seconds;
        const el = document.getElementById('timer');
        const badge = el.closest('.timer');
        const paint = () => {
            el.textContent = Math.max(remaining, 0);
            if (badge) badge.classList.toggle('urgent', remaining <= 5);
        };
        paint();
        countdownInterval = setInterval(() => {
            remaining--;
            paint();
            if (remaining <= 0) clearInterval(countdownInterval);
        }, 1000);
    }

    document.querySelectorAll('.option-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const questionId = btn.dataset.questionId;
            if (!questionId) return;

            const selectedOption = parseInt(btn.dataset.option);
            const answerTimeMs = Date.now() - questionStartTime;

            document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
            btn.classList.add('selected');
            document.getElementById('answer-feedback').textContent = 'Answer submitted!';

            stompClient.publish({
                destination: '/app/session/' + sessionId + '/answer',
                body: JSON.stringify({
                    participantToken: participantToken,
                    questionId: parseInt(questionId),
                    selectedOption: selectedOption,
                    timeTakenMs: answerTimeMs
                })
            });
        });
    });

</script>

</body>
</html>
