<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
  Shared head. Usage:
  <head th:replace="~{fragments/layout :: head('Page title · Kwizz')}"></head>
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title th:text="${title}">Kwizz</title>

    <!-- Set the theme before first paint so there is no light/dark flash -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('kwizz-theme');
                if (t !== 'light' && t !== 'dark') {
                    t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { /* storage blocked: fall back to CSS defaults */ }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/theme.js}" defer></script>
</head>

<body>

<!--
  Shared navbar. Usage:
  <header th:replace="~{fragments/layout :: navbar('host', 'quizzes')}"></header>

  mode   : 'host'   -> My quizzes / New quiz links + Log out button
           'public' -> Join a quiz / Host log in links
           'player' -> brand + theme toggle only (nothing to navigate away to mid-game)
  active : 'quizzes' | 'new' | 'join' | 'login' | '' (highlights the current link)
-->
<header class="navbar" th:fragment="navbar(mode, active)">
    <div class="navbar-inner">

        <a class="brand" th:if="${mode != 'player'}" th:href="${mode == 'host'} ? @{/quizzes} : @{/}">
            <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span>Kwizz</span>
        </a>
        <span class="brand" th:if="${mode == 'player'}">
            <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span>Kwizz</span>
        </span>

        <nav id="site-nav" class="nav-links" aria-label="Main" th:if="${mode != 'player'}">
            <th:block th:if="${mode == 'host'}">
                <a th:href="@{/quizzes}" th:classappend="${active == 'quizzes'} ? 'active'"
                   th:attr="aria-current=${active == 'quizzes'} ? 'page'">My quizzes</a>
                <a th:href="@{/quizzes/new}" th:classappend="${active == 'new'} ? 'active'"
                   th:attr="aria-current=${active == 'new'} ? 'page'">New quiz</a>
            </th:block>
            <th:block th:if="${mode == 'public'}">
                <a th:href="@{/join}" th:classappend="${active == 'join'} ? 'active'"
                   th:attr="aria-current=${active == 'join'} ? 'page'">Join a quiz</a>
                <a th:href="@{/login}" th:classappend="${active == 'login'} ? 'active'"
                   th:attr="aria-current=${active == 'login'} ? 'page'">Host log in</a>
            </th:block>
        </nav>

        <div class="nav-actions">
            <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch theme" title="Switch theme">
                <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                </svg>
                <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>
            </button>

            <!-- POST + th:action so Spring Security's CSRF token is included automatically -->
            <form class="logout-form" th:if="${mode == 'host'}" th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-secondary btn-sm">Log out</button>
            </form>

            <button type="button" class="icon-btn nav-burger" th:if="${mode != 'player'}"
                    aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" aria-hidden="true">
                    <path d="M4 7h16M4 12h16M4 17h16"/>
                </svg>
            </button>
        </div>
    </div>
</header>

</body>
</html>
