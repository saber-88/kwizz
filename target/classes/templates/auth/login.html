<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in · Kwizz')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar('public', 'login')}"></header>

<main class="container narrow auth-wrap">
    <div class="card auth-card">
        <h1>Log in</h1>
        <p class="card-sub">Log in to create quizzes and host live sessions.</p>

        <div class="alert alert-error" role="alert" th:if="${param.error}">Invalid username or password.</div>
        <div class="alert alert-success" role="status" th:if="${param.logout}">You've been logged out.</div>
        <div class="alert alert-success" role="status" th:if="${param.registered}">Account created. Please log in.</div>

        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-block btn-lg">Log in</button>
        </form>

        <p class="auth-foot">Need an account? <a class="text-link" th:href="@{/register}">Register</a></p>
    </div>
</main>
</body>
</html>
