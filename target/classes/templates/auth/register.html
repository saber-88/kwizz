<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register · Kwizz')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar('public', 'login')}"></header>

<main class="container narrow auth-wrap">
    <div class="card auth-card">
        <h1>Create a host account</h1>
        <p class="card-sub">Hosts build quizzes and run them live for their class.</p>

        <div class="alert alert-error" role="alert" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required>
            </div>

            <button type="submit" class="btn btn-block btn-lg">Create account</button>
        </form>

        <p class="auth-foot">Already have an account? <a class="text-link" th:href="@{/login}">Log in</a></p>
    </div>
</main>
</body>
</html>
